<svg xmlns="http://www.w3.org/2000/svg" width="900" height="309" viewBox="0 0 900 309">
<rect x="0" y="0" width="900" height="88" rx="6" fill="#F4F9FE" stroke="#D6E4F3" stroke-width="1"/>
<rect x="0" y="0" width="44" height="88" rx="6" fill="#185FA5"/>
