<svg xmlns="http://www.w3.org/2000/svg" width="900" height="492" viewBox="0 0 900 492">
<rect x="1" y="1" width="898" height="490" rx="10" fill="#F2FBF7" stroke="#C9E7DC" stroke-width="1.5"/>
<rect x="1" y="1" width="898" height="6" rx="3" fill="#0F6E56"/>
<rect x="1" y="4" width="898" height="4" fill="#0F6E56"/>

<circle cx="35" cy="40" r="9" fill="#0F6E56"/>
<path d="M 31 40 l 3 3.5 l 6 -7" fill="none" stroke="#FFFFFF" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
<text x="56" y="48" font-family="Roboto, Arial, Helvetica, sans-serif" font-size="25" font-weight="700" fill="#04342C">Defining and Calling Functions</text>
<text x="56" y="80" font-family="Roboto, Arial, Helvetica, sans-serif" font-size="21" font-weight="400" fill="#2C4A41">Functions organize reusable blocks of code, and def is used to define</text>
<text x="56" y="110" font-family="Roboto, Arial, Helvetica, sans-serif" font-size="21" font-weight="400" fill="#2C4A41">a function before it is called.</text>
<rect x="26" y="124" width="848" height="1" fill="#C9E7DC"/>

<circle cx="35" cy="158" r="9" fill="#0F6E56"/>
<path d="M 31 158 l 3 3.5 l 6 -7" fill="none" stroke="#FFFFFF" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
<text x="56" y="166" font-family="Roboto, Arial, Helvetica, sans-serif" font-size="25" font-weight="700" fill="#04342C">Arguments and Return Values</text>
<text x="56" y="198" font-family="Roboto, Arial, Helvetica, sans-serif" font-size="21" font-weight="400" fill="#2C4A41">Parameters receive input, arguments provide actual values, and return</text>
<text x="56" y="228" font-family="Roboto, Arial, Helvetica, sans-serif" font-size="21" font-weight="400" fill="#2C4A41">sends results back so they can be reused.</text>
<rect x="26" y="242" width="848" height="1" fill="#C9E7DC"/>

<circle cx="35" cy="276" r="9" fill="#0F6E56"/>
<path d="M 31 276 l 3 3.5 l 6 -7" fill="none" stroke="#FFFFFF" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
<text x="56" y="284" font-family="Roboto, Arial, Helvetica, sans-serif" font-size="25" font-weight="700" fill="#04342C">Advanced Function Features</text>
<text x="56" y="316" font-family="Roboto, Arial, Helvetica, sans-serif" font-size="21" font-weight="400" fill="#2C4A41">Local and global variables, lambda functions, *args, **kwargs, and</text>
<text x="56" y="346" font-family="Roboto, Arial, Helvetica, sans-serif" font-size="21" font-weight="400" fill="#2C4A41">module functions extend how Python functions can be used.</text>
<rect x="26" y="360" width="848" height="1" fill="#C9E7DC"/>

<circle cx="35" cy="394" r="9" fill="#0F6E56"/>
<path d="M 31 394 l 3 3.5 l 6 -7" fill="none" stroke="#FFFFFF" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
<text x="56" y="402" font-family="Roboto, Arial, Helvetica, sans-serif" font-size="25" font-weight="700" fill="#04342C">Data and AI Applications</text>
<text x="56" y="434" font-family="Roboto, Arial, Helvetica, sans-serif" font-size="21" font-weight="400" fill="#2C4A41">Functions support reusable data processing, normalization, prediction,</text>
<text x="56" y="464" font-family="Roboto, Arial, Helvetica, sans-serif" font-size="21" font-weight="400" fill="#2C4A41">filtering, and transformation steps in data and AI workflows.</text>
</svg>