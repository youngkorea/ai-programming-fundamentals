<svg xmlns="http://www.w3.org/2000/svg" width="900" height="276" viewBox="0 0 900 276">
<rect x="0" y="0" width="291" height="131" rx="6" fill="#F4F9FE" stroke="#D6E4F3" stroke-width="1"/>
<text x="18" y="36" font-family="Roboto, Arial, Helvetica, sans-serif" font-size="17" font-weight="700" fill="#0C447C">
<tspan x="18" dy="0">Readable syntax</tspan>
</text>
<text x="18" y="61" font-family="Roboto, Arial, Helvetica, sans-serif" font-size="14" font-weight="400" fill="#3D3D3A">
<tspan x="18" dy="0">Concise and intuitive. A variable</tspan>
<tspan x="18" dy="21">is named total_price rather than</tspan>
<tspan x="18" dy="21">x.</tspan>
</text>
<rect x="305" y="0" width="291" height="131" rx="6" fill="#F4F9FE" stroke="#D6E4F3" stroke-width="1"/>
<text x="323" y="36" font-family="Roboto, Arial, Helvetica, sans-serif" font-size="17" font-weight="700" fill="#0C447C">
<tspan x="323" dy="0">Versatility</tspan>
</text>
<text x="323" y="61" font-family="Roboto, Arial, Helvetica, sans-serif" font-size="14" font-weight="400" fill="#3D3D3A">
<tspan x="323" dy="0">Web development, data analysis,</tspan>
<tspan x="323" dy="21">artificial intelligence, game</tspan>
<tspan x="323" dy="21">development, and more.</tspan>
</text>
<rect x="609" y="0" width="291" height="131" rx="6" fill="#F4F9FE" stroke="#D6E4F3" stroke-width="1"/>
<text x="627" y="36" font-family="Roboto, Arial, Helvetica, sans-serif" font-size="17" font-weight="700" fill="#0C447C">
<tspan x="627" dy="0">Strong community</tspan>
</text>
<text x="627" y="61" font-family="Roboto, Arial, Helvetica, sans-serif" font-size="14" font-weight="400" fill="#3D3D3A">
<tspan x="627" dy="0">A vast set of open-source</tspan>
<tspan x="627" dy="21">libraries and active support.</tspan>
</text>
<rect x="0" y="145" width="291" height="131" rx="6" fill="#F4F9FE" stroke="#D6E4F3" stroke-width="1"/>
<text x="18" y="181" font-family="Roboto, Arial, Helvetica, sans-serif" font-size="17" font-weight="700" fill="#0C447C">
<tspan x="18" dy="0">High productivity</tspan>
</text>
<text x="18" y="206" font-family="Roboto, Arial, Helvetica, sans-serif" font-size="14" font-weight="400" fill="#3D3D3A">
<tspan x="18" dy="0">Students accomplish a great deal</tspan>
<tspan x="18" dy="21">with little code.</tspan>
</text>
<rect x="305" y="145" width="291" height="131" rx="6" fill="#F4F9FE" stroke="#D6E4F3" stroke-width="1"/>
<text x="323" y="181" font-family="Roboto, Arial, Helvetica, sans-serif" font-size="17" font-weight="700" fill="#0C447C">
<tspan x="323" dy="0">Industry demand</tspan>
</text>
<text x="323" y="206" font-family="Roboto, Arial, Helvetica, sans-serif" font-size="14" font-weight="400" fill="#3D3D3A">
<tspan x="323" dy="0">Employers ask for Python across</tspan>
<tspan x="323" dy="21">many roles, including data</tspan>
<tspan x="323" dy="21">scientist and software developer.</tspan>
</text>
</svg>