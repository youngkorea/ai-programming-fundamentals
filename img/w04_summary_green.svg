<svg xmlns="http://www.w3.org/2000/svg" width="900" height="430" viewBox="0 0 900 430">
  <rect width="900" height="430" rx="18" fill="#FFFFFF"/>
  <rect x="0" y="0" width="10" height="430" rx="5" fill="#0F6E56"/>
  <text x="42" y="42" fill="#0F6E56" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="800">Key Takeaways</text>
  
  <circle cx="62" cy="85" r="24" fill="#EAF5F0"/>
  <text x="62" y="92" text-anchor="middle" fill="#0F6E56" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="800">1</text>
  <text x="104" y="81" fill="#0F6E56" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="800">Dictionaries</text>
  <text x="104" y="109" fill="#5B6E67" font-family="Arial, Helvetica, sans-serif" font-size="17">Store and retrieve data as key-value pairs.</text>
  <circle cx="62" cy="175" r="24" fill="#EAF5F0"/>
  <text x="62" y="182" text-anchor="middle" fill="#0F6E56" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="800">2</text>
  <text x="104" y="171" fill="#0F6E56" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="800">Dictionary Operations</text>
  <text x="104" y="199" fill="#5B6E67" font-family="Arial, Helvetica, sans-serif" font-size="17">Use operators, methods, and iteration to manage mappings.</text>
  <circle cx="62" cy="265" r="24" fill="#EAF5F0"/>
  <text x="62" y="272" text-anchor="middle" fill="#0F6E56" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="800">3</text>
  <text x="104" y="261" fill="#0F6E56" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="800">Sets</text>
  <text x="104" y="289" fill="#5B6E67" font-family="Arial, Helvetica, sans-serif" font-size="17">Store unique values and apply basic set operations.</text>
  <circle cx="62" cy="355" r="24" fill="#EAF5F0"/>
  <text x="62" y="362" text-anchor="middle" fill="#0F6E56" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="800">4</text>
  <text x="104" y="351" fill="#0F6E56" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="800">Choosing a Structure</text>
  <text x="104" y="379" fill="#5B6E67" font-family="Arial, Helvetica, sans-serif" font-size="17">Use dictionaries for mappings and sets for uniqueness.</text>
</svg>