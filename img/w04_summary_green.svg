<svg xmlns="http://www.w3.org/2000/svg" width="900" height="520" viewBox="0 0 900 520">
  <rect width="900" height="520" rx="24" fill="#F4FAF7"/>
  <text x="48" y="48" fill="#0F6E56" font-family="Arial, Helvetica, sans-serif" font-size="30" font-weight="800">Key Takeaways</text>
  
  <g transform="translate(48 80)">
    <rect width="804" height="90" rx="18" fill="#FFFFFF" stroke="#D6E9E2"/>
    <circle cx="46" cy="45" r="25" fill="#0F6E56"/>
    <text x="46" y="52" text-anchor="middle" fill="#FFFFFF" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="800">01</text>
    <text x="86" y="36" fill="#18322B" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="800">Dictionaries</text>
    <text x="86" y="64" fill="#5D726B" font-family="Arial, Helvetica, sans-serif" font-size="17">Store data as key-value pairs and access or modify values by key.</text>
  </g>
  <g transform="translate(48 184)">
    <rect width="804" height="90" rx="18" fill="#FFFFFF" stroke="#D6E9E2"/>
    <circle cx="46" cy="45" r="25" fill="#0F6E56"/>
    <text x="46" y="52" text-anchor="middle" fill="#FFFFFF" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="800">02</text>
    <text x="86" y="36" fill="#18322B" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="800">Working with Dictionaries</text>
    <text x="86" y="64" fill="#5D726B" font-family="Arial, Helvetica, sans-serif" font-size="17">Use operators, methods, and iteration to retrieve and manage mapped data.</text>
  </g>
  <g transform="translate(48 288)">
    <rect width="804" height="90" rx="18" fill="#FFFFFF" stroke="#D6E9E2"/>
    <circle cx="46" cy="45" r="25" fill="#0F6E56"/>
    <text x="46" y="52" text-anchor="middle" fill="#FFFFFF" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="800">03</text>
    <text x="86" y="36" fill="#18322B" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="800">Sets</text>
    <text x="86" y="64" fill="#5D726B" font-family="Arial, Helvetica, sans-serif" font-size="17">Store unique elements and use union, intersection, and difference operations.</text>
  </g>
  <g transform="translate(48 392)">
    <rect width="804" height="90" rx="18" fill="#FFFFFF" stroke="#D6E9E2"/>
    <circle cx="46" cy="45" r="25" fill="#0F6E56"/>
    <text x="46" y="52" text-anchor="middle" fill="#FFFFFF" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="800">04</text>
    <text x="86" y="36" fill="#18322B" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="800">Data Applications</text>
    <text x="86" y="64" fill="#5D726B" font-family="Arial, Helvetica, sans-serif" font-size="17">Use dictionaries for mappings and sets for unique values and deduplication.</text>
  </g>
</svg>