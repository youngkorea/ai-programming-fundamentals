<svg xmlns="http://www.w3.org/2000/svg" width="900" height="612" viewBox="0 0 900 612">
<rect x="1" y="0" width="898" height="144" rx="6" fill="#F4F9FE" stroke="#0C447C" stroke-width="1.5"/>
<rect x="1" y="0" width="62" height="144" rx="6" fill="#0C447C"/>
<rect x="57" y="0" width="6" height="144" fill="#0C447C"/>
<text x="32.0" y="48.0" font-family="Roboto, Arial, Helvetica, sans-serif" font-size="30" font-weight="700" fill="#FFFFFF" text-anchor="middle">1</text>
<text x="84" y="48.0" font-family="Roboto, Arial, Helvetica, sans-serif" font-size="26" font-weight="700" fill="#185FA5">Objects and Types</text>
<text x="84" y="84.0" font-family="Roboto, Arial, Helvetica, sans-serif" font-size="21" font-weight="400" fill="#1B3A5C">Python programs work with objects, and each object has a type that</text>
<text x="84" y="114.0" font-family="Roboto, Arial, Helvetica, sans-serif" font-size="21" font-weight="400" fill="#1B3A5C">determines how it can be used.</text>
<rect x="1" y="156" width="898" height="144" rx="6" fill="#F4F9FE" stroke="#0C447C" stroke-width="1.5"/>
<rect x="1" y="156" width="62" height="144" rx="6" fill="#0C447C"/>
<rect x="57" y="156" width="6" height="144" fill="#0C447C"/>
<text x="32.0" y="204.0" font-family="Roboto, Arial, Helvetica, sans-serif" font-size="30" font-weight="700" fill="#FFFFFF" text-anchor="middle">2</text>
<text x="84" y="204.0" font-family="Roboto, Arial, Helvetica, sans-serif" font-size="26" font-weight="700" fill="#185FA5">Basic Data Types and Expressions</text>
<text x="84" y="240.0" font-family="Roboto, Arial, Helvetica, sans-serif" font-size="21" font-weight="400" fill="#1B3A5C">Python uses types such as int, float, and str, and expressions</text>
<text x="84" y="270.0" font-family="Roboto, Arial, Helvetica, sans-serif" font-size="21" font-weight="400" fill="#1B3A5C">combine values and operators.</text>
<rect x="1" y="312" width="898" height="144" rx="6" fill="#F4F9FE" stroke="#0C447C" stroke-width="1.5"/>
<rect x="1" y="312" width="62" height="144" rx="6" fill="#0C447C"/>
<rect x="57" y="312" width="6" height="144" fill="#0C447C"/>
<text x="32.0" y="360.0" font-family="Roboto, Arial, Helvetica, sans-serif" font-size="30" font-weight="700" fill="#FFFFFF" text-anchor="middle">3</text>
<text x="84" y="360.0" font-family="Roboto, Arial, Helvetica, sans-serif" font-size="26" font-weight="700" fill="#185FA5">Boolean Expressions</text>
<text x="84" y="396.0" font-family="Roboto, Arial, Helvetica, sans-serif" font-size="21" font-weight="400" fill="#1B3A5C">Comparison and logical operators create Boolean expressions that</text>
<text x="84" y="426.0" font-family="Roboto, Arial, Helvetica, sans-serif" font-size="21" font-weight="400" fill="#1B3A5C">evaluate to True or False.</text>
<rect x="1" y="468" width="898" height="144" rx="6" fill="#F4F9FE" stroke="#0C447C" stroke-width="1.5"/>
<rect x="1" y="468" width="62" height="144" rx="6" fill="#0C447C"/>
<rect x="57" y="468" width="6" height="144" fill="#0C447C"/>
<text x="32.0" y="516.0" font-family="Roboto, Arial, Helvetica, sans-serif" font-size="30" font-weight="700" fill="#FFFFFF" text-anchor="middle">4</text>
<text x="84" y="516.0" font-family="Roboto, Arial, Helvetica, sans-serif" font-size="26" font-weight="700" fill="#185FA5">Variables and Type Conversion</text>
<text x="84" y="552.0" font-family="Roboto, Arial, Helvetica, sans-serif" font-size="21" font-weight="400" fill="#1B3A5C">Variables refer to values, while type conversion changes values from</text>
<text x="84" y="582.0" font-family="Roboto, Arial, Helvetica, sans-serif" font-size="21" font-weight="400" fill="#1B3A5C">one data type to another.</text>
</svg>